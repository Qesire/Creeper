source_mode = "activated"
runtime_data_root = "/srv/creeper/data"
baseline_index = "/srv/creeper/data/indexes/baseline-fast.sqlite3"

[limits]
source_workers = 2
source_extract_workers = 1
pipeline_batch_size = 1000
queue_source_records = 512
queue_observations = 1024
queue_evidence_tasks = 1024
queue_commits = 1024
lease_max_records = 10000
lease_max_requests = 8
lease_max_bytes = 67108864
lease_max_seconds = 300
evidence_backlog_capacity = 10000
rdap_backlog_capacity = 4096

[historical_index]
enabled = true
background_only = true
max_indexes_per_cycle = 2
max_probe_actions_per_index = 2
probe_parallelism = 2
sample_bytes = 524288
sample_windows = 4
probe_timeout_seconds = 20
probe_baseline_batch_size = 25000
minhash_width = 64
max_depth = 8
min_child_bytes = 4194304
min_observations_to_stop = 64
zero_yield_stop_confidence = 0.01
min_novel_fraction = 0.0
min_novel_eed_per_mib = 0.0
exploration_weight = 0.25
max_harvest_regions_per_cycle = 2
harvest_byte_budget = 134217728
unknown_overlap_penalty = 0.25
confidence_floor = 0.25
min_marginal_fraction = 0.01
min_marginal_eed = 0.0
min_score_per_mib = 0.0
harvest_max_seconds = 300
harvest_max_records_per_lease = 100000
harvest_baseline_batch_size = 20000
boundary_record_max_bytes = 4194304
harvest_policy_version = "historical-region-v1"
claim_grace_seconds = 60
busy_poll_seconds = 0.25
idle_poll_seconds = 5
