[worker]
coordinator_url = "http://127.0.0.1:8088"
worker_id = "oci-a1-evidence"
worker_instance_id = "auto"
runtime_class = "oci-a1-single-host"
region = "oci-home"
architecture = "aarch64"
memory_bytes = 6442450944
cpu_count = 1
network_class = "public-egress"
capabilities = ["EVIDENCE_QUERY", "RDAP"]
producers = ["EvidenceQueryProducer"]
allowed_providers = ["internet_archive", "arquivo_pt", "rdap"]
daily_egress_budget_bytes = 21474836480
spool_database = "/srv/creeper/spool/evidence.sqlite3"
secret_env = "CREEPER_WORKER_EVIDENCE_SECRET"
poll_seconds = 1
claim_wait_seconds = 10
lease_seconds = 300
heartbeat_seconds = 30
