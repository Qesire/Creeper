[project]
name = "creeper"
version = "2.1.0.dev0"
description = "Baseline-aware historical Web hostname discovery"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2,<2",
    "aiohttp>=3.9,<4",
    "fsspec>=2024.10,<2027",
    "httpx>=0.28,<1",
    "requests>=2.31,<3",
    "selectolax>=0.4.11,<0.5",
    "tenacity>=9,<10",
    "warcio>=1.8.1,<2",
]

[project.optional-dependencies]
s3 = [
    "s3fs>=2024.10,<2027",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
creeper = "creeper.cli:main"
creeper-source-discovery = "creeper.source_discovery_service:main"
creeper-source-producer = "creeper.source_cli:main"
creeper-evidence-worker = "creeper.evidence_cli:main"
creeper-platform-harvest = "creeper.platform_harvest_cli:main"
creeper-autopilot = "creeper.autopilot:main"
creeper-readiness-worker = "creeper.readiness_cli:main"
creeper-submission-export = "creeper.submission_cli:main"
creeper-historical-index = "creeper.historical_index_service:main"
creeper-validation = "creeper.validation_cli:main"
creeper-fabric-authority = "creeper.distributed.authority_cli:main"
creeper-fabric-worker = "creeper.distributed.worker_cli:main"
creeper-fabric-control = "creeper.distributed.control_cli:main"
creeper-fabric-evidence-bridge = "creeper.distributed.evidence_bridge_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
