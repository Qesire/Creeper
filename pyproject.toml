[project]
name = "creeper"
version = "2.1.0.dev0"
description = "Baseline-aware historical Web hostname discovery"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2,<2",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
]

[project.scripts]
creeper = "creeper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
