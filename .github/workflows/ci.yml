name: CI

on:
  push:

permissions:
  contents: read

jobs:
  lock-probe:
    name: Resolve selectolax lock
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve and print lockfile
        run: |
          uv lock
          echo '===== UV_LOCK_BEGIN ====='
          cat uv.lock
          echo '===== UV_LOCK_END ====='
