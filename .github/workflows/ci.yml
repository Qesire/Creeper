name: CI

on:
  push:

permissions:
  contents: write

jobs:
  lock-probe:
    name: Resolve selectolax lock
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: probe/selectolax-lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve lockfile
        run: uv lock

      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh selectolax uv lock"
          git push origin HEAD:probe/selectolax-lock
