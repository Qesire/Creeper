name: CI

on:
  push:

permissions:
  contents: write

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    env:
      CREEPER_NETWORK_TESTS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve root lock with uv
        run: uv lock

      - name: Persist generated lock on probe branch
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- uv.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "probe(deps): materialize warcio uv lock"
            git push
          fi

      - name: Sync locked environment
        run: uv sync --all-groups --locked

      - name: Run offline test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Build package
        run: uv build

      - name: Check patch whitespace
        run: git diff --check

  scrapy-sidecar:
    name: Scrapy acquisition sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/scrapy_acquisition

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync isolated locked environment
        run: uv sync --locked

      - name: Run sidecar tests
        run: uv run python -m unittest discover -s tests -v

      - name: Verify Scrapy project settings
        run: uv run scrapy settings --get BOT_NAME
