name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creeper_test
          POSTGRES_USER: creeper
          POSTGRES_PASSWORD: creeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creeper -d creeper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CREEPER_NETWORK_TESTS: "0"
      CREEPER_POSTGRES_TEST_DSN: "postgresql://creeper:creeper@127.0.0.1:5432/creeper_test"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --all-groups --locked

      - name: Install PostgreSQL Fabric test dependency
        run: uv pip install "psycopg[binary]>=3.2,<4"

      - name: Run offline test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Build package
        run: uv build

      - name: Check patch whitespace
        run: git diff --check

  scrapy-sidecar:
    name: Scrapy acquisition sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/scrapy_acquisition

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync isolated locked environment
        run: uv sync --locked

      - name: Run sidecar tests
        run: uv run python -m unittest discover -s tests -v

      - name: Verify Scrapy project settings
        run: uv run scrapy settings --get BOT_NAME
