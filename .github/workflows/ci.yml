name: CI

on:
  push:

permissions:
  contents: read

jobs:
  lock-probe:
    name: Resolve selectolax lock
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve lockfile
        run: uv lock

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: selectolax-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
