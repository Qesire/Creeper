name: Fabric Runtime Smoke

on:
  push:
    paths:
      - "src/creeper/distributed/**"
      - "src/creeper/evidence/**"
      - "src/creeper/storage/**"
      - "tests/integration/test_fabric_runtime_smoke.py"
      - ".github/workflows/fabric-runtime-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: Authority-worker runtime topology
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creeper_test
          POSTGRES_USER: creeper
          POSTGRES_PASSWORD: creeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creeper -d creeper_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CREEPER_POSTGRES_TEST_DSN: "postgresql://creeper:creeper@127.0.0.1:5432/creeper_test"
      CREEPER_NETWORK_TESTS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --all-groups --locked

      - name: Install PostgreSQL Fabric dependency
        run: uv pip install "psycopg[binary]>=3.2,<4"

      - name: Run Fabric runtime topology smoke
        run: >-
          uv run python -m unittest
          tests.integration.test_fabric_runtime_smoke -v
