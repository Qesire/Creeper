# Production config for discovery-activated source reservoirs.
source_mode = "activated"
runtime_data_root = "/path/to/Creeper-data/v3-merged260909-3"
baseline_index = "/path/to/Creeper-data/v3-merged260909-3/baseline.sqlite3"

[limits]
# Independent source workers claim different durable reservoir leases. This is
# the outer pipeline layer: source I/O on one reservoir overlaps lookup/planning
# on other reservoirs.
source_workers = 4

# Within each lease, records and observations flow through real bounded
# producer-consumer queues. Extraction workers never own SQLite authority.
source_extract_workers = 2
pipeline_batch_size = 1000

queue_source_records = 1000
queue_observations = 1000
queue_evidence_tasks = 1000
queue_commits = 1000

# One bounded source lease. The long-lived producer reuses BaselineIndex,
# SQLite connections, and adapter instances between leases.
lease_max_records = 10000
lease_max_requests = 16
lease_max_bytes = 67108864
lease_max_seconds = 300

# Durable provider backlog high-water. Discovery/source acquisition pauses
# before this queue is over-admitted.
evidence_backlog_capacity = 10000
# RDAP registration-year evidence uses a separate provider/network budget.
rdap_backlog_capacity = 4096
