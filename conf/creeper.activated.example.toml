# Production config for discovery-activated source reservoirs.
source_mode = "activated"
runtime_data_root = "/path/to/Creeper-data/v4-merged260912-3"
baseline_index = "/path/to/Creeper-data/v4-merged260912-3/indexes/baseline-fast.sqlite3"

[limits]
# Independent source workers claim different durable reservoir leases. This is
# the outer pipeline layer: source I/O on one reservoir overlaps lookup/planning
# on other reservoirs.
source_workers = 4

# Within each lease, records and observations flow through real bounded
# producer-consumer queues. Extraction workers never own SQLite authority.
source_extract_workers = 2
pipeline_batch_size = 1000

queue_source_records = 1000
queue_observations = 1000
queue_evidence_tasks = 1000
queue_commits = 1000

# One bounded source lease. The long-lived producer reuses BaselineIndex,
# SQLite connections, and adapter instances between leases.
lease_max_records = 10000
lease_max_requests = 16
lease_max_bytes = 67108864
lease_max_seconds = 300

# Durable provider backlog high-water. Discovery/source acquisition pauses
# before this queue is over-admitted.
evidence_backlog_capacity = 10000
# RDAP registration-year evidence uses a separate provider/network budget.
rdap_backlog_capacity = 4096


[historical_index]
# Delegate only uncompressed direct-evidence CDX/CDXJ indexes that the region
# optimizer can safely own. Compressed or non-range-capable remote indexes stay
# on the ordinary sequential source-producer path.
enabled = true

# Fair, bounded tomography. Indexes are rotated durably between cycles.
max_indexes_per_cycle = 4
max_probe_actions_per_index = 4
probe_parallelism = 4
sample_bytes = 524288
sample_windows = 4
probe_timeout_seconds = 20.0
probe_baseline_batch_size = 50000
minhash_width = 64

# Adaptive refinement / stopping.
max_depth = 8
min_child_bytes = 4194304
min_observations_to_stop = 64
zero_yield_stop_confidence = 0.01
min_novel_fraction = 0.0
min_novel_eed_per_mib = 0.0
exploration_weight = 0.25

# Cross-index marginal coverage portfolio.
max_harvest_regions_per_cycle = 4
harvest_byte_budget = 268435456
unknown_overlap_penalty = 0.25
confidence_floor = 0.25
min_marginal_fraction = 0.01
min_marginal_eed = 0.0
min_score_per_mib = 0.0

# Exact harvest uses real per-year witnesses and durable byte resume cursors.
harvest_max_seconds = 300.0
harvest_max_records_per_lease = 100000
harvest_baseline_batch_size = 20000
# Allows a record that starts inside a selected region to finish past the
# partition edge without making region reads unbounded.
boundary_record_max_bytes = 4194304
harvest_policy_version = "historical-region-v1"
claim_grace_seconds = 60.0

busy_poll_seconds = 0.25
idle_poll_seconds = 5.0
