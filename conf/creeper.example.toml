baseline_id = "merged260912-3"
task_root = "/path/to/Domain_Data_Collection_Task"
runtime_data_root = "/path/to/Creeper-data/v4-merged260912-3"
baseline_index = "indexes/baseline-fast.sqlite3"
dataset = "sources/local-hosts.txt"
source_id = "local_dataset"
domain_id = "local_static_dataset"
reservoir_id = "local_dataset"
source_year = 1997

[limits]
# In-memory queues bound one process. They are not the cross-process backlog.
queue_source_records = 1000
queue_observations = 1000
queue_evidence_tasks = 1000
queue_commits = 1000

# One finite SourceLease.
lease_max_records = 1000
lease_max_requests = 1000
lease_max_bytes = 10485760
lease_max_seconds = 300

# Durable producer high-water. SourceProducer reserves from this capacity before
# opening a SourceLease. It is deliberately independent from EvidenceWorker
# max_inflight/RPS/HTTP connection limits.
evidence_backlog_capacity = 10000
# RDAP registration-year evidence uses a separate provider/network budget.
rdap_backlog_capacity = 4096

# Legacy synchronous `creeper run --once` evidence execution bound. Production
# source/evidence processes do not use this as network concurrency.
evidence_capacity = 1000

