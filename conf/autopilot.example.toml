# One-command autonomous Creeper runtime.
# The referenced discovery and producer configs must point at the same
# runtime_data_root. The producer may use source_mode = "static" or "activated".

source_discovery_config = "source-discovery.example.toml"
source_producer_config = "creeper.activated.example.toml"

[supervisor]
# Child health is checked at this cadence.
poll_seconds = 1.0
# Unexpected child exits are restarted with bounded exponential backoff.
restart_base_seconds = 2.0
restart_max_seconds = 60.0
max_restarts = 5
# A child that stays healthy this long clears its accumulated restart count.
stable_reset_seconds = 300.0
shutdown_grace_seconds = 10.0

[evidence]
# Conservative public Wayback profile. Increase only after bounded A/B tests.
endpoint = "https://web.archive.org/cdx/search/cdx"
claim_batch_size = 16
lease_seconds = 300.0
# Keep request-start rate conservative while allowing enough concurrent waits
# to hide Wayback/proxy latency.
max_inflight = 4
requests_per_second = 0.5
max_connections = 8
max_keepalive_connections = 4
throttle_floor_seconds = 2.0
timeout = 30.0
max_retries = 3
retry_base_seconds = 30.0
retry_max_seconds = 3600.0
poll_min_seconds = 0.25
poll_max_seconds = 10.0

[readiness]
# Optional fourth autopilot child. It consumes only newly proven unique
# (hostname, year) evidence pairs and maintains annual Novel EED incrementally.
enabled = true
# Omit eed_model to reuse [measurement].eed_model from source-discovery config.
# eed_model = "/path/to/equivalent_english_domain_model.json"
# This value is authority-specific. Update it together with baseline_index if
# the competition baseline changes; a baseline file change automatically
# resets/replays novelty, while this denominator remains explicit configuration.
baseline_eed = "35266393.8852"
batch_size = 50000
max_batches_per_cycle = 20
poll_seconds = 30.0

[resource_governor]
# Optional process-level safety guard for long unattended runs.
# Tune these values to the actual machine before enabling.
enabled = false
# Aggregate RSS includes the autopilot process, all Creeper children, and Linux
# descendants such as Scrapy sidecars.
rss_throttle_gib = 16
rss_stop_gib = 24
# Low disk enters DRAIN_ONLY at the throttle watermark; the hard watermark
# stops all children and aborts autopilot.
disk_throttle_gib = 50
disk_stop_gib = 10
# Escalation is immediate. Recovery requires this many consecutive healthier
# supervisor samples so state does not flap around a threshold.
recovery_samples = 5
