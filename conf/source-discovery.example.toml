# Creeper source-discovery control-plane example.
# Paths are resolved relative to this file unless absolute.

runtime_data_root = "/path/to/Creeper-data/v4-merged260912-3"
scrapy_project_dir = "../tools/scrapy_acquisition"

[pool]
# Reservoir watermarks. Search only runs when usable cold inventory is below cold_min.
active_min = 2
active_target = 3
warm_min = 10
warm_target = 20
cold_min = 50
cold_target = 100
# Thousands of siblings from one origin count only this much toward refill.
# Rows remain durable/auditable; this is scheduling credit only.
max_cold_credit_per_origin = 12
triage_batch = 16
scout_parallelism = 4
max_search_directives = 3

[saturation]
# Current-authority measured siblings with durable zero yield suppress only
# their exact origin for scheduling. Never suppress BULK_ARTIFACT globally.
min_measured_siblings = 32
min_total_observations = 0
max_total_novel_eed_for_zero_class = 0.0
suppression_ttl_seconds = 21600.0

[coordinator]
# External I/O overlaps; SQLite authority commits remain serialized.
triage_parallelism = 8
scout_parallelism = 4
search_parallelism = 3
# Transient executor failures are retried after this process-local backoff.
failure_retry_seconds = 30.0
# Completed strategies, including valid empty-result searches, are durably cooled down.
search_cooldown_seconds = 30.0
# UCB exploration over historically observed search strategies.
search_ucb_exploration = 0.35
# A zero-credit tail of this many completed search episodes triggers RECOVER_STAGNATION.
stagnation_window = 6

[triage]
# HEAD first, then a tiny ranged GET only when the server rejects HEAD.
timeout_seconds = 10.0

[scrapy]
# Structural scout only. Link volume never becomes a yield measurement.
max_pages = 100
max_depth = 2
max_seconds = 120
max_memory_mb = 512
follow_query = false

[measurement]
# Optional deterministic yield gate for concrete SOURCE/BULK_ARTIFACT nodes.
# Remove this whole table to keep concrete sources in HOLD until a measured adapter exists.
baseline_index = "/path/to/Creeper-data/v4-merged260912-3/indexes/baseline-fast.sqlite3"
eed_model = "/path/to/task-root/equivalent_english_domain/CC-MAIN-2024-10_primary_page_language_percentage.json"
# Only a bounded prefix is fetched; WARC/ARC use warcio; unsupported formats remain HOLD.
max_download_bytes = 8388608
max_decompressed_bytes = 33554432
max_records = 5000
max_line_bytes = 65536
# Spread the fixed max_download_bytes budget across safe uncompressed
# line-oriented resources. Gzip/WARC remain prefix-only because arbitrary
# compressed-byte ranges are not independently parseable.
sample_windows = 4
# These are scout promotion thresholds, not submission acceptance thresholds.
min_unique_hosts = 100
min_novel_hosts = 10
min_novel_fraction = 0.01
min_novel_eed = 1.0
timeout_seconds = 30.0
# Multi-fidelity scout: line-oriented sources get a cheap 64 KiB first look.
# Strong positives can promote immediately; saturated low-yield sources stop
# before the full 8 MiB stratified sample.
progressive_initial_bytes = 65536
early_accept_multiplier = 4.0
early_reject_unseen_fraction = 0.01

[admission]
# Search-time prior gate. This is intentionally before baseline/CDX verification:
# the Agent must already bring large, enumerable, 1996-2001-relevant resources.
target_year_from = 1996
target_year_to = 2001
min_expected_volume = 100000
# CDX/CDXJ rows are already timestamp-bearing annual evidence, so even
# substantially smaller direct-evidence reservoirs can dominate per-host
# Wayback verification on accepted Novel EED / wall-clock.
direct_min_expected_volume = 10000
min_enumerability_prior = 0.50
min_confidence = 0.35
require_year_bounds = true

[agent]
# Parent -> child contract:
#   <command...> --request REQUEST.json --response RESPONSE.json
# The Creeper parent process explicitly launches a fresh Codex child agent for
# DISCOVER_NEW_SOURCE / EXPLOIT_SUCCESS_PATTERN / INTERPRET_STRUCTURE /
# RECOVER_STAGNATION. The child receives only a bounded state snapshot and has
# proposal-only authority; SQLite, baseline authority and submission stay hidden.
command = ["python", "../scripts/creeper_codex_subagent.py"]
backend = "codex-cli-subagent"
actor = "codex:source-intelligence"
# cwd should normally be the Creeper checkout so the wrapper can find its schema.
# cwd = "/path/to/Creeper"
timeout_seconds = 180.0
termination_grace_seconds = 2.0
max_response_bytes = 2097152
max_returned_candidates = 2000
max_returned_hypotheses = 128
max_motif_expansions = 256
