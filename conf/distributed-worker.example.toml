[worker]
coordinator_url = "https://coord.example"
worker_id = "oci-home-01"
runtime_class = "vm"
region = "oci-home"
architecture = "aarch64"
memory_bytes = 12884901888
cpu_count = 2
network_class = "public"
capabilities = ["ONLINE_QUERY", "STREAMING_BULK", "WEB_DISCOVERY", "RDAP"]
# Fail-closed egress/provider policy enforced by Local Authority.
allowed_providers = ["internet_archive", "arquivo_pt", "web_discovery"]
# 0 = unlimited. Constrained workers (for example GCP free-tier nodes) should
# set a finite daily raw response-byte budget.
daily_egress_budget_bytes = 0
secret_env = "CREEPER_WORKER_SECRET"
poll_seconds = 1.0
lease_seconds = 300.0

[[cdx_providers]]
name = "internet_archive"
endpoint = "https://web.archive.org/cdx/search/cdx"
dialect = "wayback"
requests_per_second = 0.5
max_inflight = 4
max_connections = 8
max_keepalive_connections = 4
row_limit = 150000
weight = 0.5

[[cdx_providers]]
name = "arquivo_pt"
endpoint = "https://arquivo.pt/wayback/cdx"
dialect = "arquivo"
requests_per_second = 1.0
max_inflight = 4
max_connections = 8
max_keepalive_connections = 4
row_limit = 100000
weight = 1.0
